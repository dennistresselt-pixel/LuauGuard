[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luauguard"
version = "0.3.0"
description = "A dependency-free heuristic security checker for Roblox Luau scripts"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["roblox", "luau", "static-analysis", "security", "sarif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/dennistresselt-pixel/LuauGuard"
Issues = "https://github.com/dennistresselt-pixel/LuauGuard/issues"

[project.scripts]
luauguard = "luauguard.cli:main"

[tool.setuptools.packages.find]
include = ["luauguard*"]
